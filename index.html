<!DOCTYPE html>
<html lang="en" class="s0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tycoon Life</title>
<style>
:root{--bg:radial-gradient(1000px 500px at 0% -10%,#5b21b6 0,transparent 60%),linear-gradient(160deg,#1e0b4a,#0b1d4a);--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.14);--ink:#fff;--mute:#c4bfee;--gold:#ffc83d;--pink:#ff5d8f;--teal:#2ec4b6;--orange:#ff9f1c;--purple:#9d4edd;--green:#06d6a0;--red:#ff4d6d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{transition:background .8s}
html.s0{--bg:radial-gradient(900px 500px at 10% -10%,#ff4fa3 0,transparent 55%),radial-gradient(800px 500px at 100% 20%,#00d4c4 0,transparent 50%),linear-gradient(160deg,#2b0f5c,#0a2a4a);--gold:#ffe14d;--pink:#ff4fa3;--teal:#00d4c4;--orange:#ff9f1c;--purple:#b15cff}
html.s1{--bg:radial-gradient(900px 500px at 0% 0%,#ffb703 0,transparent 55%),radial-gradient(900px 500px at 100% 100%,#e63946 0,transparent 55%),linear-gradient(160deg,#3a0f1f,#7a1e2e);--gold:#ffd166;--pink:#ff6b6b;--teal:#ffb703;--orange:#fb8500;--purple:#c2185b}
html.s2{--bg:radial-gradient(900px 500px at 50% -20%,#c9a227 0,transparent 55%),linear-gradient(170deg,#06142e,#0d2b52);--gold:#ffd27a;--pink:#e0b84c;--teal:#2bb673;--orange:#d4a017;--purple:#3a6ea5}
html.s3{--bg:radial-gradient(900px 500px at 20% 0%,#b8a4ff 0,transparent 55%),radial-gradient(800px 500px at 100% 80%,#7ee8c9 0,transparent 55%),linear-gradient(170deg,#2e3a66,#44528a);--gold:#ffe9a8;--pink:#c9b6ff;--teal:#7ee8c9;--orange:#ffc39a;--purple:#9d8cff}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.logo{width:56px;height:56px;cursor:pointer;filter:drop-shadow(0 4px 10px rgba(255,200,61,.55));flex:none}
.brand h1{margin:0;font:800 1.5rem/1.1 system-ui;background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.mini{font-size:.82rem;color:var(--mute)}
#cash{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 0 18px rgba(255,200,61,.35);line-height:1.1}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:var(--card);display:grid;place-items:center}
.iconbtn .si{width:22px;height:22px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;backdrop-filter:blur(6px)}
.age{margin:12px 0}
.agehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.agehead b{font-size:1.35rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.18);margin-left:4px;vertical-align:middle;color:#fff}
.bchip{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff;margin-right:6px;vertical-align:middle;text-shadow:0 1px 1px rgba(0,0,0,.35);letter-spacing:.2px}
.track{position:relative;height:24px;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
.shade{position:absolute;top:0;bottom:0;right:0;background:rgba(10,4,30,.6)}
.mark{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 10px #fff}
.ms{position:relative;height:18px;margin-top:6px;font-size:.72rem;color:var(--mute)}
.ms span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ms span:first-child{transform:none}
.ms span:last-child{transform:translateX(-100%)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px}
nav button{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:var(--card);white-space:nowrap}
nav button[aria-selected="true"]{background:linear-gradient(90deg,var(--pink),var(--orange));border-color:transparent;font-weight:700;box-shadow:0 4px 14px rgba(255,93,143,.4)}
.si{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav .si{width:18px;height:18px}
.art{width:58px;height:58px;flex:none;border-radius:16px;background:var(--card2);padding:5px;box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 55%,transparent),0 6px 16px rgba(0,0,0,.3)}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--purple) 40%,transparent),color-mix(in srgb,var(--teal) 30%,transparent))}
.hero .art{width:84px;height:84px;padding:8px;border-radius:20px}
h3{margin:18px 2px 8px;font-size:1rem;letter-spacing:.3px;color:var(--gold)}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);border:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.row .info{flex:1;min-width:0}
.row b{display:block;line-height:1.3}
.sub{font-size:.85rem;color:var(--mute);font-variant-numeric:tabular-nums}
.ibtn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:6px 14px 6px 6px;font-weight:800;font-size:.88rem;color:#1b0b00;background:linear-gradient(135deg,var(--gold),var(--orange));box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 18px color-mix(in srgb,var(--gold) 40%,transparent);min-width:112px;justify-content:center;font-variant-numeric:tabular-nums}
.ibtn .ic{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.ibtn .ic svg{width:18px;height:18px;fill:none;stroke:#1b0b00;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ibtn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);min-width:120px}
.ibtn.ghost .ic{background:rgba(255,255,255,.22)}
.ibtn.ghost .ic svg{stroke:#fff}
.ibtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ibtn:disabled{background:rgba(255,255,255,.14);color:var(--mute);box-shadow:none;cursor:not-allowed}
.ibtn:disabled .ic{background:rgba(255,255,255,.1)}
.ibtn:disabled .ic svg{stroke:var(--mute)}
.ibtn.ghost:disabled{background:transparent}
#work{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:20px;border:0;border-radius:22px;font-size:1.25rem;font-weight:900;color:#2a1700;background:linear-gradient(135deg,#ffe066,var(--orange) 60%,var(--pink));box-shadow:0 6px 0 #b8560a,0 0 30px rgba(255,159,28,.4);margin-bottom:4px}
#work:active{transform:translateY(4px);box-shadow:0 2px 0 #b8560a}
#work .si{width:32px;height:32px;stroke:#2a1700}
.up{color:var(--green)}.down{color:var(--red)}
.spark{width:90px;height:30px;flex:none}
.feed{max-height:240px;overflow:auto;font-size:.9rem}
.feed div{padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.news{font-size:.92rem;margin:0 0 6px}
.pop{position:fixed;z-index:30;transform:translate(-50%,-100%);font-weight:900;font-size:1.15rem;color:var(--gold);text-shadow:0 2px 0 #000;pointer-events:none;animation:pop .95s ease-out forwards}
@keyframes pop{to{transform:translate(-50%,-270%);opacity:0}}
.coin{position:fixed;z-index:30;width:22px;height:22px;margin:-11px;pointer-events:none;animation:fly .85s ease-out forwards}
.coin svg{width:22px;height:22px;display:block}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(320deg) scale(.4);opacity:0}}
.enter>*{animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#1e0b4a;font-weight:700;padding:10px 16px;border-radius:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.on{opacity:1}
.lb{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:14px;margin-bottom:6px;background:var(--card);font-variant-numeric:tabular-nums}
.lb.me{background:linear-gradient(90deg,rgba(255,93,143,.45),rgba(255,159,28,.45));font-weight:800}
.modal{position:fixed;inset:0;background:rgba(10,4,30,.8);display:none;place-items:center;z-index:50;padding:20px}
.modal.on{display:grid}
.modal .card{max-width:420px;text-align:center;background:linear-gradient(160deg,#3b1a7a,#0e5b6b)}
.modal h2{margin:4px 0 8px;font-size:1.7rem;color:var(--gold)}
footer{margin:22px 0 10px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 {id:'baby',title:'A surprise pregnancy',text:'You are going to be a parent.',min:25,max:42,p:.25,ok:()=>(S.married||S.partner)&&(S.kids||0)<3,choices:[{l:'Welcome the baby',fx:()=>{S.kids=(S.kids||0)+1;return 'Your child was born. Life is busier and costs more now.'}},{l:'Not yet',fx:()=>'You decided to wait.'}]},
 {id:'divorce',title:'The marriage is ending',text:'You and your spouse cannot agree on how to split things.',min:28,max:65,p:.12,ok:()=>S.married,choices:[{l:'Settle amicably (give up 40% of cash)',fx:()=>{if(S.money>0)S.money*=.6;S.married=false;S.partner=false;return 'It hurt, but it ended quickly.'}},{l:'Fight in court',cost:30000,fx:()=>{S.married=false;S.partner=false;if(Math.random()<.5){S.money*=1.1;return 'The court ruled in your favour.'}S.money*=.8;return 'The court ruled against you.'}}]},
 {id:'layoff',title:'Your company is downsizing',text:'Your position is being cut.',min:20,max:64,p:.15,ok:()=>!!jobOf()&&jobOf().ft,choices:[{l:'Take the severance (3 months pay)',fx:()=>{S.money+=jobOf().salary/4;S.job=null;return 'You left with a severance check.'}},{l:'Fight to keep your job',fx:()=>{if(Math.random()<.5)return 'Management relented. You keep your job.';S.job=null;return 'The layoff went through anyway.'}}]},
 {id:'illness',title:'Sudden illness',text:'The doctor found something serious and says treatment cannot wait.',min:18,max:90,p:.1,ok:()=>true,choices:[{l:'Private surgery',cost:30000,fx:()=>'The surgery went well. You are back on your feet.'},{l:'Public hospital (long wait)',fx:()=>{S.money-=5000;return 'You waited months, but you recovered.'}},{l:'Rest at home',fx:()=>{const j=jobOf();if(j)S.money-=j.salary/6;return 'You lost weeks of work but healed.'}}]},
 {id:'startup',title:'A startup idea',text:'A friend wants you to co-found a tech startup with $50,000 of your savings.',min:22,max:55,p:.2,ok:()=>true,choices:[{l:'Invest $50k',cost:50000,fx:()=>{if(Math.random()<.4){S.money+=150000;return 'The startup was acquired. You made $150k!'}return 'The startup folded. The money is gone.'}},{l:'Pass',fx:()=>'You kept your money. The startup later went viral without you.'}]},
 {id:'lottery',title:'You won the lottery!',text:'A ticket you bought on a whim just hit the jackpot.',min:18,max:90,p:.04,ok:()=>true,choices:[{l:'Claim $1,000,000',fx:()=>{S.money+=1000000;return 'A million dollars. Life will never be the same.'}},{l:'Claim $500k, share the rest',fx:()=>{S.money+=500000;return 'Your family cheers. You keep half.'}}]},
 {id:'crash',title:'Market crash',text:'Stocks plunge 40% overnight and panic spreads.',min:26,max:80,p:.1,ok:()=>stockVal()>0,pre:()=>STOCKS.forEach(s=>S.prices[s.id]*=.6),choices:[{l:'Sell everything now',fx:()=>{STOCKS.forEach(s=>{S.money+=(S.stk[s.id]||0)*S.prices[s.id];S.stk[s.id]=0});return 'You sold at the bottom and locked in the loss.'}},{l:'Hold and buy the dip',fx:()=>{STOCKS.forEach(s=>S.prices[s.id]*=1.6);return 'You held on, and the market recovered.'}}]},
 {id:'recession',title:'Recession',text:'Customers vanish and business profits fall sharply.',min:25,max:75,p:.1,ok:()=>bizIncome()>0,choices:[{l:'Cut costs',cost:10000,fx:()=>'You trimmed the fat and kept things running.'},{l:'Ride it out',fx:()=>{S.money-=bizIncome()*.25;return 'Profits dropped for a year.'}}]},
 {id:'parent',title:'A family loss',text:'Your mother has passed away. The funeral is this week.',min:40,max:90,p:.08,ok:()=>true,choices:[{l:'Take two months off',fx:()=>{const j=jobOf();if(j)S.money-=j.salary/6;return 'You grieved with family and returned slowly.'}},{l:'Keep working',fx:()=>'You stayed busy, but the grief stayed with you.'}]},
 {id:'midlife',title:'Midlife restlessness',text:'You feel the urge for something new.',min:42,max:58,p:.12,ok:()=>true,choices:[{l:'Buy a Porsche 911',cost:120000,fx:()=>{addLot('c-porsche');return 'A 911 in your garage. You felt 25 again.'}},{l:'Travel to Japan',cost:20000,fx:()=>'A month wandering Tokyo and Kyoto.'}]},
 {id:'fire',title:'Fire at your home',text:'A fire damaged one of your properties.',min:25,max:90,p:.1,ok:()=>S.lots.some(l=>ITEM_BY[l.id].cat==='Property'),choices:[{l:'Claim insurance',fx:()=>{S.money-=12500;return 'Insurance covered most of it.'}},{l:'Pay for repairs',cost:25000,fx:()=>'You rebuilt the property, better than before.'}]}
];
const TABS=[['life','Life','t-life'],['biz','Business','t-biz'],['shop','Shop','t-shop'],['stock','Stocks','t-stock'],['club','Clubs','t-club'],['rank','Ranking','t-rank']];

// ================= STATE =================
let S=null, tab='life', muted=false, last=performance.now();
function fresh(){
  const s={money:0,age:START,day:0,lastDay:0,lastYr:START,biz:{},lots:[],stk:{},club:null,job:null,
    deg:{business:0,engineering:0,medicine:0,science:0,arts:0},lic:{},study:null,
    prices:{},hist:{},log:['1 Sep 2010: You turn 18. Find a job, or study for a degree or licence.'],
    over:false,pending:null,partner:false,married:false,kids:0,m1:false};
  STOCKS.forEach(x=>{s.prices[x.id]=x.p;s.hist[x.id]=[x.p]});
  return s;
}
function load(){
  let s={};try{s=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
  const m=Object.assign(fresh(),s);
  STOCKS.forEach(x=>{if(m.prices[x.id]==null){m.prices[x.id]=x.p;m.hist[x.id]=[x.p]}});
  return m;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// ================= HELPERS =================
const $=id=>document.getElementById(id);
const fmt=n=>{const neg=n<0;n=Math.abs(n);let s;if(n<1000)s=n<10?n.toFixed(2):Math.floor(n).toString();else{const u=['K','M','B','T'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}s=n.toFixed(n<10?2:1)+u[i]}return (neg?'\u2212':'')+'$'+s};
const I=id=>`<svg class="si" viewBox="0 0 24 24" aria-hidden="true"><use href="#${id}"/></svg>`;
const A=id=>`<svg class="art" viewBox="0 0 48 48" aria-hidden="true"><use href="#${id}"/></svg>`;
const B=(ic,label,attrs='',dis=false,kind='')=>`<button class="ibtn ${kind}" ${attrs} ${dis?'disabled':''}><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#${ic}"/></svg></span><span>${label}</span></button>`;
const chip=i=>i.brand?`<span class="bchip" style="background:${i.c}">${i.brand}</span>`:'';
const stageOf=a=>STAGES.find(s=>a<s.to)||STAGES[STAGES.length-1];
const dateOf=d=>new Date(BASE+Math.floor(d)*864e5);
const bizCost=b=>Math.floor(b.base*Math.pow(1.15,S.biz[b.id]||0));
const clubMult=()=>{const c=CLUBS.find(c=>c.id===S.club);return c?c.mult:1};
const bizIncome=()=>BIZ.reduce((a,b)=>a+b.inc*(S.biz[b.id]||0),0)*clubMult()*(1+BIZ_DEGREE_BONUS*(S.deg.business||0));
const jobOf=()=>JOBS.find(j=>j.id===S.job);
const yearIncome=()=>bizIncome()+(jobOf()?jobOf().salary:0)+(S.age>=RETIRE?PENSION:0);
const living=age=>Math.round(3000*Math.pow(1.03,age-START));
const lotValue=l=>{const it=ITEM_BY[l.id],yrs=Math.max(0,(S.day-l.day)/365.25);return l.paid*Math.pow(1+it.rate,yrs)};
const upkeep=()=>S.lots.reduce((a,l)=>a+lotValue(l)*0.02,0);
const assetVal=()=>S.lots.reduce((a,l)=>a+lotValue(l),0);
const addLot=id=>{const it=ITEM_BY[id];S.lots.push({id,paid:it.price,day:S.day})};
const bizVal=()=>BIZ.reduce((a,b)=>{let t=0;for(let k=0;k<(S.biz[b.id]||0);k++)t+=b.base*Math.pow(1.15,k);return a+t},0);
const stockVal=()=>STOCKS.reduce((a,s)=>a+(S.stk[s.id]||0)*S.prices[s.id],0);
const netWorth=()=>S.money+stockVal()+assetVal()+bizVal();
const clickVal=()=>Math.max(25,Math.round(30+0.01*yearIncome()));
const log=t=>{S.log.push(t);if(S.log.length>80)S.log.shift()};

// requirement checks and wording
function meets(r){
  if(!r)return true;
  if(r.any&&!Object.values(S.deg).some(v=>v>=r.any))return false;
  if(r.deg)for(const f in r.deg)if((S.deg[f]||0)<r.deg[f])return false;
  if(r.lic)for(const l of r.lic)if(!S.lic[l])return false;
  if(r.age&&S.age<r.age)return false;
  return true;
}
function reqText(r){
  const p=[];
  if(!r||!Object.keys(r).length)return 'no requirements';
  if(r.any)p.push('any degree');
  if(r.deg)for(const f in r.deg)p.push(FIELDS[f].name+' '+FIELDS[f].names[r.deg[f]-1]);
  if(r.lic)for(const l of r.lic)p.push(LIC_BY[l].name);
  if(r.age)p.push('age '+r.age+'+');
  return p.join(' + ');
}
function jobReason(j){
  if(!meets(j.req))return 'Locked';
  if(j.ft&&S.study)return 'Finish studies';
  if(S.age>=RETIRE)return 'Retired';
  return '';
}
function knowledgeText(){
  const d=Object.keys(FIELDS).filter(f=>S.deg[f]).map(f=>FIELDS[f].names[S.deg[f]-1]);
  const l=LICENSES.filter(x=>S.lic[x.id]).map(x=>x.name);
  return [...d,...l].join(' \u00b7 ')||'None yet';
}

// ================= SOUND =================
let AC=null;
function tone(f,d,type,v,w=0,to){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime+w,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05)}catch(e){}}
function noise(d,v){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const SFX={
  click:()=>tone(900,.06,'triangle',.08),
  coin:()=>{tone(1318,.1,'square',.04);tone(1976,.16,'square',.04,.07)},
  cash:()=>{noise(.1,.18);tone(1800,.08,'sine',.05,.03)},
  buy:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.12,i*.07))},
  sell:()=>{[1046,784,659].forEach((f,i)=>tone(f,.18,'sine',.12,i*.07))},
  year:()=>{[660,880,1100].forEach((f,i)=>tone(f,.45,'sine',.1,i*.12))},
  event:()=>{tone(300,.25,'square',.05,0,600);tone(600,.2,'square',.04,.2)},
  err:()=>tone(180,.2,'sawtooth',.07,0,120),
  win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.35,'triangle',.12,i*.1))}
};

// ================= EFFECTS =================
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),2600)}
function popup(x,y,t){const f=document.createElement('div');f.className='pop';f.textContent=t;f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),950)}
function coins(x,y,n){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='coin';c.innerHTML='<svg viewBox="0 0 48 48"><use href="#s-coin"/></svg>';const a=Math.PI*2*i/n;c.style.left=x+'px';c.style.top=y+'px';c.style.setProperty('--dx',Math.cos(a)*70+'px');c.style.setProperty('--dy',(Math.sin(a)*70-40)+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),850)}}
function spark(h){const mn=Math.min(...h),mx=Math.max(...h),r=(mx-mn)||1;const pts=h.map((v,i)=>`${(i/Math.max(h.length-1,1)*96).toFixed(1)},${(28-(v-mn)/r*24).toFixed(1)}`).join(' ');const c=h[h.length-1]>=h[0]?'#06d6a0':'#ff4d6d';return `<svg class="spark" viewBox="0 0 96 30" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" points="${pts}"/></svg>`}

// ================= TIME =================
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function processDay(d){
  const dt=dateOf(d);
  if(d%14===0){ // biweekly paycheck, 18% tax withheld
    const j=jobOf(),gross=j?j.salary/26:0,pension=S.age>=RETIRE?PENSION/26:0;
    const tax=gross*TAX,net=gross-tax+pension;
    if(net>0){S.money+=net;log('Payday: net '+fmt(net)+' (tax '+fmt(tax)+').')}
  }
  if(dt.getUTCDate()===1){ // 1st of month: business profit, rent, bills, tuition
    const profit=bizIncome()/12*(1-TAX);
    const tuition=(S.study&&S.study.kind==='deg')?S.study.tuition/12:0;
    const bills=living(S.age)/12+upkeep()/12+tuition+(S.kids||0)*400;
    S.money+=profit-bills;
    log(MONTHS[dt.getUTCMonth()]+' '+dt.getUTCFullYear()+': business +'+fmt(profit)+', rent & bills \u2212'+fmt(bills)+'.');
  }
  if(dt.getUTCMonth()===0&&dt.getUTCDate()===1){
    const y=dt.getUTCFullYear(),news=NEWS[y];
    log('1 Jan '+y+': '+(news?news.join(' \u2022 '):'no headlines on record for this year.'));
    toast('New year '+y+(news?': '+news[0]:''));
  }
}
function completeStudy(){
  const s=S.study;
  if(s.kind==='deg'){S.deg[s.field]=s.lvl;log('Graduated: '+s.name+'.')}
  else{S.lic[s.id]=true;log('Earned: '+s.name+'.')}
  S.study=null;SFX.win();toast('Completed: '+s.name);
}
function yearEnd(age){
  log('Happy birthday. You are now '+age+'.');
  if(age===RETIRE){S.job=null;log('You retired. Your pension starts.')}
  if(Math.random()<.6){
    const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)](S);
    S.money+=ev.cash;
    if(ev.dip)STOCKS.forEach(s=>S.prices[s.id]*=.9);
    log(ev.msg+' '+(ev.cash>=0?'+':'\u2212')+fmt(Math.abs(ev.cash)));
    SFX.event();
  }
  rollLife(age);
  SFX.year();
  render();save();
}
function rollLife(age){
  if(S.pending)return;
  const pool=LIFE.filter(e=>age>=e.min&&age<=e.max&&e.ok()&&Math.random()<e.p);
  if(!pool.length)return;
  const e=pool[Math.floor(Math.random()*pool.length)];
  if(e.pre)e.pre();
  S.pending=e.id;
}
function showEvent(){
  const ev=LIFE.find(x=>x.id===S.pending);if(!ev)return;
  $('evtT').textContent=ev.title;$('evtB').textContent=ev.text;
  const anyOk=ev.choices.some(c=>(c.cost||0)<=S.money); // if nothing is affordable, unlock all so the story can always continue
  $('evtC').innerHTML=ev.choices.map((c,i)=>B(['ic-plus','ic-check','ic-up'][i%3],c.l+(c.cost?' \u00b7 '+fmt(c.cost):''),'data-ev="'+i+'" data-cost="'+(c.cost||0)+'"',((c.cost||0)>S.money)&&anyOk)).join('');
  $('evt').classList.add('on');
}
function gameOver(){
  S.over=true;
  const nw=netWorth(),tier=nw<1e6?'Humble beginnings':nw<1e7?'Comfortable life':nw<1e8?'Tycoon':nw<1e9?'Billionaire':'Legend';
  $('overT').textContent=tier;
  $('overB').innerHTML=`You lived to 90 with a net worth of <b>${fmt(nw)}</b>.<br><span class="mini">Knowledge: ${knowledgeText()}</span>`;
  $('over').classList.add('on');SFX.win();save();
}
function frame(now){
  const dt=Math.min(now-last,500);last=now;
  if(!S.over&&!S.pending){
    S.day+=dt/DAY;
    S.age=START+S.day/365.25;
    while(S.lastDay<Math.floor(S.day)&&!S.over){S.lastDay++;processDay(S.lastDay)}
    if(S.study&&S.day>=S.study.end)completeStudy();
    while(Math.floor(S.age)>S.lastYr&&!S.over){S.lastYr++;yearEnd(S.lastYr)}
    if(S.pending&&!$('evt').classList.contains('on'))showEvent(); // BUGFIX: open the life-event modal as soon as an event rolls
    if(S.age>=END_AGE&&!S.over){S.age=END_AGE;gameOver()}
  }
  ageBox();head();
  requestAnimationFrame(frame);
}

// ================= HEADER =================
function head(){
  $('cash').textContent=fmt(S.money);
  $('cash').style.color=S.money<0?'#ff4d6d':'';
  $('nw').textContent='Net worth '+fmt(netWorth())+' \u00b7 '+(yearIncome()>=0?'+':'')+fmt(yearIncome())+'/yr';
}
function ageBox(){
  const a=S.age,st=stageOf(a),pct=(a-START)/(END_AGE-START)*100;
  const cls='s'+STAGES.indexOf(st);if(document.documentElement.className!==cls)document.documentElement.className=cls;
  const p=x=>((x-START)/(END_AGE-START)*100).toFixed(2)+'%';
  const marks=[[START,'Start'],[22,'Degree'],[26,'Career'],[RETIRE,'Retire'],[END_AGE,'End']];
  const dstr=dateOf(S.lastDay).toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric',year:'numeric'});
  $('agebox').innerHTML=
    `<div class="agehead"><b>Age ${Math.floor(a)}</b><span class="tag" style="background:${st.color}">${st.name}</span><span class="mini">${dstr}</span><span class="mini">Birthday in ${Math.ceil((1-(a%1))*365.25)} days</span></div>`+
    `<div class="track" style="background:linear-gradient(90deg,#2ec4b6 0 ${p(22)},#ff9f1c ${p(22)} ${p(26)},#ff5d8f ${p(26)} ${p(RETIRE)},#9d4edd ${p(RETIRE)})"><div class="shade" style="left:${pct}%"></div><div class="mark" style="left:${pct}%"></div></div>`+
    `<div class="ms">${marks.map(([m,t])=>`<span style="left:${p(m)}">${m} ${t}</span>`).join('')}</div>`;
}

// ================= VIEWS =================
function tabs(){$('tabs').innerHTML=TABS.map(([k,n,i])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${I(i)}${n}</button>`).join('')}
function jobRow(j){
  const mine=S.job===j.id,r=mine?'':jobReason(j);
  const label=mine?'Quit':(r||'Apply');
  return `<div class="row">${A(j.art)}<div class="info"><b>${j.name}${mine?' <span class="tag">Current</span>':''}</b><span class="sub">${fmt(j.salary)}/yr \u00b7 requires ${reqText(j.req)}</span></div>${B(mine||r?'ic-x':'ic-plus',label,'data-job="'+j.id+'"',!mine&&!!r,mine?'ghost':'')}</div>`;
}
function degRow(f){
  const F=FIELDS[f],cur=S.deg[f]||0,max=F.names.length;
  if(cur>=max)return `<div class="row">${A(F.art)}<div class="info"><b>${F.name}: ${F.names[cur-1]}</b><span class="sub">Highest level completed</span></div>${B('ic-check','Done','',true)}</div>`;
  const L=cur+1;
  let reason='';
  if(S.study&&S.study.kind==='deg'&&S.study.field===f)reason='In progress';
  else if(S.study)reason='Busy';
  else if(S.age>F.maxAge[L-1])reason='Too old';
  else if(jobOf()&&jobOf().ft)reason='Quit job first';
  return `<div class="row">${A(F.art)}<div class="info"><b>${F.name}: ${F.names[L-1]}</b><span class="sub">${F.years[L-1]} years \u00b7 ${F.tuition[L-1]?fmt(F.tuition[L-1])+'/yr tuition':'funded (no tuition)'}${cur?' \u00b7 builds on '+F.names[cur-1]:''}</span></div>${B('ic-cap',reason||'Enroll','data-deg="'+f+'"',!!reason)}</div>`;
}
function licRow(l){
  const owned=!!S.lic[l.id],studying=S.study&&S.study.kind==='lic'&&S.study.id===l.id;
  let label=owned?'Licensed':studying?'In progress':S.study?'Busy':S.money<l.cost?'Need '+fmt(l.cost):'Enroll';
  const dis=owned||studying||!!S.study||S.money<l.cost;
  return `<div class="row">${A(l.art)}<div class="info"><b>${l.name}</b><span class="sub">${fmt(l.cost)} fee \u00b7 ${l.days}-day course \u00b7 needed for ${Object.keys(LIC_FOR).filter(k=>LIC_FOR[k]===l.id).join(', ')}</span></div>${B(owned?'ic-check':'ic-cap',label,'data-lic="'+l.id+'"',dis)}</div>`;
}
function lifeV(){
  const st=stageOf(S.age),j=jobOf();
  let studyTxt='Not studying';
  if(S.study)studyTxt=S.study.name+' \u00b7 '+Math.max(0,(S.study.end-S.day)/365.25).toFixed(1)+' yr left';
  const y=dateOf(S.lastDay).getUTCFullYear(),news=NEWS[y]||['No headlines on record for this year.'];
  const feed=S.log.slice(-16).reverse().map(x=>`<div>${x}</div>`).join('');
  return `<div class="card hero">${A(st.art)}<div><b>${st.name}</b>
    <div class="sub">${j?'Working as '+j.name+' \u00b7 '+fmt(j.salary)+'/yr':'Not employed'}</div>
    <div class="sub">Knowledge: ${knowledgeText()}</div>
    <div class="sub">Study: ${studyTxt}</div>
    <div class="sub">Pay: ${j?fmt(j.salary/26)+' gross every 2 weeks':'no paycheck'} \u00b7 Rent & bills: ${fmt((living(Math.floor(S.age))+upkeep()+(S.study&&S.study.kind==='deg'?S.study.tuition:0))/12)}/month</div></div></div>
    <div class="card" style="margin-bottom:10px"><div class="mini" style="margin-bottom:6px">In the world, ${y}</div>${news.map(n=>`<p class="news">\u2022 ${n}</p>`).join('')}</div>
    <button id="work">${I('ic-coins')}<span>Side hustle \u00b7 +${fmt(clickVal())}</span></button>
    <p class="sub">Paychecks come every 2 weeks with 18% tax withheld. Rent, bills and business profit settle on the 1st of each month.</p>
    <h3>Jobs</h3>${JOBS.map(jobRow).join('')}
    <h3>Degrees</h3>${Object.keys(FIELDS).map(degRow).join('')}
    <p class="sub">You can study one course at a time. Full-time jobs cannot be combined with a degree; part-time work can.</p>
    <h3>Licences</h3>${LICENSES.map(licRow).join('')}
    <h3>Life log</h3><div class="card feed">${feed||'<div class="sub">Nothing yet.</div>'}</div>`;
}
function bizV(){
  return BIZ.map(b=>{const n=S.biz[b.id]||0,c=bizCost(b),ok=meets(b.req);
    const label=!ok?'Need degree':(n?'Expand':'Open');
    return `<div class="row">${A(b.art)}<div class="info"><b>${b.name} <span class="tag">Lv ${n}</span></b><span class="sub">+${fmt(b.inc*clubMult()*(1+BIZ_DEGREE_BONUS*(S.deg.business||0)))}/yr per level \u00b7 next ${fmt(c)} \u00b7 needs ${reqText(b.req)}</span></div>${B(ok?(n?'ic-up':'ic-plus'):'ic-x',label,'data-b="'+b.id+'" data-cost="'+c+'"',!ok||S.money<c)}</div>`
  }).join('')+`<p class="sub">Businesses pay monthly, after tax. Each business degree level adds ${BIZ_DEGREE_BONUS*100}% to profit. Each new business level costs 15% more.</p>`;
}
function shopV(){
  const mine=S.lots.length?`<h3>My items</h3>`+S.lots.map((l,idx)=>{
    const it=ITEM_BY[l.id],v=lotValue(l),resale=v*(1-RESALE_FEE);
    return `<div class="row">${A(it.art)}<div class="info"><b>${chip(it)}${it.name}</b><span class="sub">Paid ${fmt(l.paid)} \u00b7 worth now ${fmt(v)} \u00b7 ${v>=l.paid?'up':'down'} ${Math.abs((v/l.paid-1)*100).toFixed(0)}%</span></div>${B('ic-down','Sell '+fmt(resale),'data-sell="'+idx+'"',false,'ghost')}</div>`;
  }).join(''):'';
  const cats=[...new Set(ITEMS.map(i=>i.cat))];
  const shop=cats.map(c=>{
    const need=LIC_FOR[c];
    const note=need?`<p class="sub">Requires ${LIC_BY[need].name}${S.lic[need]?' \u2714 you have it':''}</p>`:'';
    return `<h3>${c}</h3>${note}`+ITEMS.filter(i=>i.cat===c).map(i=>{
      const lockedLic=need&&!S.lic[need];
      const label=lockedLic?'Need licence':fmt(i.price);
      return `<div class="row">${A(i.art)}<div class="info"><b>${chip(i)}${i.name}</b><span class="sub">+${i.lux} status \u00b7 ${i.rate>=0?'gains':'loses'} ~${Math.abs(i.rate*100).toFixed(0)}%/yr \u00b7 upkeep ${fmt(i.price*0.02)}/yr</span></div>${B(lockedLic?'ic-lock':'ic-bag',label,'data-i="'+i.id+'" data-cost="'+i.price+'"',lockedLic||S.money<i.price)}</div>`;
    }).join('');
  }).join('');
  return mine+shop+`<p class="sub">Resale value is current market value minus a ${RESALE_FEE*100}% fee.</p>`;
}
function stockV(){
  return STOCKS.map(s=>{
    const p=S.prices[s.id],h=S.hist[s.id],ch=h.length>1?(p/h[h.length-2]-1)*100:0,q=S.stk[s.id]||0;
    return `<div class="row">${A(s.art)}<div class="info"><b>${s.id} <span class="${ch>=0?'up':'down'}">${ch>=0?'\u25b2':'\u25bc'}${Math.abs(ch).toFixed(1)}%</span></b><span class="sub">${s.name} \u00b7 ${fmt(p)} \u00b7 you hold ${q}</span></div>${spark(h)}${B('ic-down','Sell','data-s="'+s.id+'" data-a="sell"',!q,'ghost')}${B('ic-up','Buy','data-s="'+s.id+'" data-a="buy" data-cost="'+p+'"',S.money<p)}</div>`
  }).join('')+'<p class="sub">Prices move every 3 seconds. Each click buys or sells one share.</p>';
}
function clubV(){
  const nw=netWorth();
  return CLUBS.map(c=>{
    const mine=S.club===c.id,ok=nw>=c.min;
    const label=mine?'Member':(!ok?'Need '+fmt(c.min):'Join');
    return `<div class="row">${A(c.art)}<div class="info"><b>${c.name}${mine?' <span class="tag">Member</span>':''}</b><span class="sub">Min net worth ${fmt(c.min)} \u00b7 fee ${fmt(c.fee)} \u00b7 income \u00d7${c.mult}</span></div>${B(mine?'ic-check':'ic-crown',label,'data-club="'+c.id+'" data-cost="'+c.fee+'" data-min="'+c.min+'"',mine||!ok||S.money<c.fee)}</div>`;
  }).join('')+'<p class="sub">You can belong to one club at a time. Joining another replaces your current one.</p>';
}
function rankV(){
  const t=Date.now()/1000;
  const rows=BOTS.map(([n,v],i)=>({n,v:v*(1+Math.sin(t/20+i)*.03)})).concat([{n:'You',v:netWorth(),me:1}]).sort((a,b)=>b.v-a.v);
  return rows.map((r,i)=>`<div class="lb ${r.me?'me':''}"><span>${i+1}. ${r.n}</span><span>${fmt(r.v)}</span></div>`).join('')+'<p class="sub">Rivals are simulated for now.</p>';
}
function view(){return {life:lifeV,biz:bizV,shop:shopV,stock:stockV,club:clubV,rank:rankV}[tab]()}
function refreshBtns(){
  document.querySelectorAll('#view [data-cost]').forEach(b=>{
    if(b.dataset.club&&S.club===b.dataset.club){b.disabled=true;return}
    if(b.dataset.b){const z=BIZ.find(q=>q.id===b.dataset.b);if(!meets(z.req)){b.disabled=true;return}}
    if(b.dataset.i){const z=ITEM_BY[b.dataset.i],need=LIC_FOR[z.cat];if(need&&!S.lic[need]){b.disabled=true;return}}
    b.disabled=S.money<+b.dataset.cost||netWorth()<+(b.dataset.min||0);
  });
}
function render(){$('view').innerHTML=view();refreshBtns()}

// ================= EVENTS =================
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-t]');if(!b)return;
  tab=b.dataset.t;tabs();
  const v=$('view');v.classList.add('enter');setTimeout(()=>v.classList.remove('enter'),900);
  render();SFX.click();
});
$('view').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top,d=b.dataset;
  if(b.id==='work'){const v=clickVal();S.money+=v;SFX.coin();popup(x,y,'+'+fmt(v))}
  else if(d.b){
    const z=BIZ.find(q=>q.id===d.b),c=bizCost(z);
    if(S.money<c||!meets(z.req)){SFX.err()}else{S.money-=c;S.biz[z.id]=(S.biz[z.id]||0)+1;SFX.buy();popup(x,y,'\u2212'+fmt(c));toast((S.biz[z.id]>1?'Expanded ':'Opened ')+z.name+'!')}
  }
  else if(d.i){
    const z=ITEM_BY[d.i];
    if(S.money<z.price){SFX.err()}else{S.money-=z.price;addLot(z.id);SFX.buy();coins(x,y,6);toast('Bought '+z.name)}
  }
  else if(d.sell!==undefined){
    const idx=+d.sell,l=S.lots[idx];if(!l)return;
    const got=lotValue(l)*(1-RESALE_FEE);
    S.money+=got;S.lots.splice(idx,1);
    SFX.cash();popup(x,y,'+'+fmt(got));toast('Sold for '+fmt(got));
  }
  else if(d.s){
    const p=S.prices[d.s];
    if(d.a==='buy'){
      if(S.money>=p){S.money-=p;S.stk[d.s]=(S.stk[d.s]||0)+1;SFX.cash();popup(x,y,'\u2212'+fmt(p))}else SFX.err();
    }else if(S.stk[d.s]){
      S.money+=p;S.stk[d.s]--;SFX.cash();popup(x,y,'+'+fmt(p));
    }else SFX.err();
  }
  else if(d.club){
    const z=CLUBS.find(q=>q.id===d.club);
    if(netWorth()>=z.min&&S.money>=z.fee){S.money-=z.fee;S.club=z.id;SFX.win();coins(x,y,10);toast('Welcome to the '+z.name+'!')}else SFX.err();
  }
  else if(d.job){
    const j=JOBS.find(q=>q.id===d.job);
    if(S.job===j.id){S.job=null;SFX.sell();toast('You quit '+j.name);log('Quit '+j.name+'.')}
    else{S.job=j.id;SFX.buy();toast('Hired as '+j.name+'!');log('Started work as '+j.name+'.')}
  }
  else if(d.deg){
    const f=d.deg,F=FIELDS[f],L=(S.deg[f]||0)+1;
    S.study={kind:'deg',field:f,lvl:L,name:F.names[L-1]+' ('+F.name+')',end:S.day+F.years[L-1]*365.25,tuition:F.tuition[L-1]};
    SFX.buy();toast('Enrolled: '+S.study.name);log('Enrolled: '+S.study.name+'.');
  }
  else if(d.lic){
    const l=LIC_BY[d.lic];
    if(S.money>=l.cost&&!S.study){S.money-=l.cost;S.study={kind:'lic',id:l.id,name:l.name,end:S.day+l.days,tuition:0};SFX.buy();toast('Enrolled: '+l.name);log('Enrolled: '+l.name+'.')}
    else SFX.err();
  }
  render();save();
});
$('evtC').addEventListener('click',e=>{
  const b=e.target.closest('button[data-ev]');if(!b||b.disabled)return;
  const ev=LIFE.find(x=>x.id===S.pending);if(!ev)return;
  const c=ev.choices[+b.dataset.ev];
  if(c.cost)S.money-=c.cost;
  const msg=c.fx()||'';
  log(ev.title+': '+msg);toast(msg);
  S.pending=null;$('evt').classList.remove('on');SFX.event();render();save();
});
function paintSnd(){$('snd').innerHTML=I(muted?'i-mute':'i-sound');$('snd').setAttribute('aria-pressed',String(!muted))}
$('snd').onclick=()=>{muted=!muted;try{localStorage.setItem('tycoon_mute',muted?'1':'0')}catch(e){};paintSnd();if(!muted)SFX.click()};
$('logo').onclick=()=>{$('logo').animate([{transform:'rotateY(0)'},{transform:'rotateY(360deg)'}],{duration:800,easing:'ease-out'})};
$('reset').onclick=()=>{if(confirm('Start a new life? Your progress will be lost.')){S=fresh();save();render();toast('A new life begins')}};
$('again').onclick=()=>{S=fresh();$('over').classList.remove('on');save();render();toast('A new life begins')};
addEventListener('beforeunload',save);

// ================= BOOT =================
try{muted=localStorage.getItem('tycoon_mute')==='1'}catch(e){}
S=load();
tabs();paintSnd();render();if(S.pending)showEvent();
requestAnimationFrame(frame);
setInterval(()=>{
  STOCKS.forEach(s=>{
    const p=S.prices[s.id],rev=(s.p-p)/s.p*0.03,np=Math.max(1,p*(1+rev+(Math.random()-.5)*2*s.vol));
    S.prices[s.id]=np;const h=S.hist[s.id];h.push(np);if(h.length>30)h.shift();
  });
  if(tab==='stock'||tab==='rank')render();
  refreshBtns();save();
},3000);
</script>
</body>
</html>
