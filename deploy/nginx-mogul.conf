# HuyenBao — reverse proxy cho mogul.huyenbao.com (nginx)
#
# mogul.huyenbao.com = domain dành riêng cho ADMIN dashboard (v11.30):
#   /        → /admin (tự chuyển, lo bởi src/proxy.ts trong Next.js)
#   /game    → game đầy đủ có backend xã hội
#   /api/*   → social + admin API
#
# Cài:  sudo cp deploy/nginx-mogul.conf /etc/nginx/sites-available/mogul.conf
#       sudo ln -sf /etc/nginx/sites-available/mogul.conf /etc/nginx/sites-enabled/
#       sudo certbot --nginx -d mogul.huyenbao.com   (HTTPS)
#       sudo nginx -t && sudo systemctl reload nginx
#
# `npm start` trên VPS phải chạy trước: next start -H 0.0.0.0 -p 3334
# LƯU Ý: phải giữ nguyên `proxy_set_header Host $host;` — src/proxy.ts dựa vào
# header Host này để biết request đến từ domain admin.

server {
        listen 80;
        listen [::]:80;
        server_name mogul.huyenbao.com;

        # Certbot sẽ tự thêm redirect 80→443 khi bật HTTPS
        location / {
                proxy_pass http://127.0.0.1:3334;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
        }
}
